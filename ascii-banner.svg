<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="'JetBrains Mono','DejaVu Sans Mono','Courier New',monospace">
  <defs>
    <!-- gradiente neon que flui pelas letras -->
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a371f7">
        <animate attributeName="stop-color" values="#a371f7;#39d0d8;#3fb950;#f778ba;#ffa657;#a371f7" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#39d0d8">
        <animate attributeName="stop-color" values="#39d0d8;#3fb950;#f778ba;#ffa657;#a371f7;#39d0d8" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#f778ba">
        <animate attributeName="stop-color" values="#f778ba;#ffa657;#a371f7;#39d0d8;#3fb950;#f778ba" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="screen"><rect x="8" y="8" width="744" height="284" rx="12"/></clipPath>
  </defs>

  <!-- janela de terminal -->
  <rect x="8" y="8" width="744" height="284" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <rect x="8" y="8" width="744" height="34" rx="12" fill="#161b22"/>
  <rect x="8" y="28" width="744" height="14" fill="#161b22"/>
  <circle cx="30" cy="25" r="6" fill="#ff5f56"/>
  <circle cx="52" cy="25" r="6" fill="#ffbd2e"/>
  <circle cx="74" cy="25" r="6" fill="#27c93f"/>
  <text x="380" y="30" fill="#8b949e" font-size="13" text-anchor="middle">rafa@dev — ~/portfolio</text>

  <!-- scanline sutil -->
  <g clip-path="url(#screen)">
    <rect x="8" y="42" width="744" height="3" fill="#ffffff" opacity="0.05">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 250" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ASCII "RAFA" (figlet slant) com gradiente neon + glow, alinhado à esquerda -->
  <g fill="url(#neon)" filter="url(#glow)" font-size="24" xml:space="preserve">
    <text x="40" y="92">    ____  ___    _________ </text>
    <text x="40" y="119">   / __ \/   |  / ____/   |</text>
    <text x="40" y="146">  / /_/ / /| | / /_  / /| |</text>
    <text x="40" y="173"> / _, _/ ___ |/ __/ / ___ |</text>
    <text x="40" y="200">/_/ |_/_/  |_/_/   /_/  |_|</text>
    <animate attributeName="opacity" values="0;1" dur="0.8s" fill="freeze"/>
  </g>

  <!-- linhas de prompt, todas na mesma margem esquerda -->
  <text x="40" y="240" fill="#c9d1d9" font-size="18" xml:space="preserve"><tspan fill="#3fb950">$</tspan> whoami<tspan fill="#8b949e"> → </tspan><tspan fill="#a371f7">full-stack</tspan> · <tspan fill="#39d0d8">ui/ux</tspan> · <tspan fill="#f778ba">ai</tspan></text>
  <text x="40" y="270" fill="#c9d1d9" font-size="18" xml:space="preserve"><tspan fill="#3fb950">$</tspan> building in public <tspan fill="#39d0d8">█<animate attributeName="fill-opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/></tspan></text>
</svg>
