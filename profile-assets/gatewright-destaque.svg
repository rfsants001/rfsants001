<svg xmlns="http://www.w3.org/2000/svg" width="820" height="228" viewBox="0 0 820 228" role="img" aria-labelledby="title desc">
  <title id="title">Gatewright</title>
  <desc id="desc">Regras para agentes de código. Desktop, terminal e MCP. Exemplo: secret-guard bloqueia a leitura de .env.</desc>
